name: CI

on:
  push:
    branches:
      - main
      - release/v1.0-validation

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full matrix on Ubuntu
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Latest stable version on Windows & macOS
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov mypy ruff

    - name: Run Ruff Lint check
      run: ruff check .

    - name: Run Ruff Format check
      run: ruff format --check .

    - name: Run Mypy Type check
      run: mypy src/

    - name: Run Pytest Suite
      run: pytest --cov=src --cov-report=xml

    - name: Verify Aedile CLI Rule Compiler
      run: python -m aedile compile-rules

