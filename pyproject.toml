[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aedile"
version = "1.1.0"
description = "Maintains architectural integrity as AI writes code."
readme = "README.md"
requires-python = ">=3.15"
license = { text = "MIT" }
authors = [
    { name = "Aaryan Rawat" }
]
keywords = [
    "ai",
    "mcp",
    "architecture",
    "static-analysis",
    "ast",
    "token-compression",
    "coding-agent",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aaryanrwt/aedile"
Repository = "https://github.com/aaryanrwt/aedile"
Documentation = "https://github.com/aaryanrwt/aedile#readme"
Issues = "https://github.com/aaryanrwt/aedile/issues"
Changelog = "https://github.com/aaryanrwt/aedile/blob/main/CHANGELOG.md"

[project.scripts]
aedile = "aedile.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aedile"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/aedile",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = "-ra -q --tb=short --cov=src/aedile --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "T20", # flake8-print
]
ignore = ["E501", "C901", "B904", "E741", "T201", "W293"]
